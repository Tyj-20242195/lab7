<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TianYujing - 个人主页</title>
    <style>
        /* 全局样式重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面主体：全屏居中显示 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 名字样式 */
        .name {
            font-size: 48px;
            font-weight: 500;
            color: #2d2d2d;
            letter-spacing: 2px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .name {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <h1 class="name">TianYujing</h1>
</body>
</html>
