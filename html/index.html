<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TianYujing - Personal Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }

        /* 生产环境醒目提示 */
        .prod-badge {
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* 名字样式 */
        .name {
            font-size: 52px;
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: 3px;
            margin-bottom: 16px;
            text-align: center;
        }

        /* 个人简介样式 */
        .bio {
            font-size: 18px;
            color: #7f8c8d;
            text-align: center;
            line-height: 1.6;
            max-width: 500px;
            font-weight: 400;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .prod-badge {
                font-size: 18px;
            }
            .name {
                font-size: 38px;
            }
            .bio {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="prod-badge">this is prod version</div>
    <h1 class="name">TianYujing</h1>
    <p class="bio">I am a student majoring in Software Engineering at North Minzu University.</p>
</body>
</html>
